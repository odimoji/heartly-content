<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Cormorant;src:url(../video3d/public/fonts/cormorant-600.woff2);font-weight:600}
@font-face{font-family:Cormorant;src:url(../video3d/public/fonts/cormorant-600i.woff2);font-weight:600;font-style:italic}
@font-face{font-family:Inter;src:url(../video3d/public/fonts/inter-600.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(../video3d/public/fonts/inter-500.woff2);font-weight:500}
body{margin:0;background:#120d0a}
</style>
<canvas id="c"></canvas>
<script src="kit/zara.js"></script><script src="kit/flat.js"></script><script src="kit/ui.js"></script><script src="kit/shots.js"></script>
<script>document.write('<script src="episodes/'+(new URLSearchParams(location.search).get("ep")||"ep01")+'.js"><\/script>');</script>
<script>
if(!window.EP)window.EP=window.EP01;const EP01=window.EP;
// ?ep=ep02 picks the episode. ?from=0&n=6 draws n shots side by side at full size (1080x1920 each), with HUD and caption
const q=new URLSearchParams(location.search),from=+(q.get('from')||0),n=+(q.get('n')||6);
const cv=document.getElementById('c');cv.width=1080*n;cv.height=1920;const ctx=cv.getContext('2d');
function grain(ctx,w,h,a){const t=document.createElement('canvas');t.width=256;t.height=256;const x=t.getContext('2d'),d=x.createImageData(256,256);let s=7;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const v=s%255;d.data[i]=v;d.data[i+1]=v*0.95;d.data[i+2]=v*0.88;d.data[i+3]=255*a;}x.putImageData(d,0,0);ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=ctx.createPattern(t,'repeat');ctx.fillRect(0,0,w,h);ctx.restore();}
// render mode: ?render=1 exposes window.frame(t) which draws the frame at time t and returns it as a JPEG
if(q.get('render')){
  cv.width=1080;cv.height=1920;
  const cache={};
  window.setup=async(timing)=>{for(const f of ['600 40px Cormorant','italic 600 40px Cormorant','600 20px Inter','500 20px Inter'])await document.fonts.load(f);window.TM=timing;return true;};
  const gr=document.createElement('canvas');gr.width=1080;gr.height=1920;grain(gr.getContext('2d'),1080,1920,0.07);
  // things that move on their own, so no frame is ever still
  const fly=(cx,cy,R,t)=>{const x=cx+R*Math.sin(t*3.1)+R*0.35*Math.sin(t*11.3),y=cy+R*0.6*Math.cos(t*2.3)+R*0.3*Math.sin(t*9.1);ctx.save();ctx.fillStyle='rgba(255,255,255,.35)';const f=Math.sin(t*90)*9;ctx.beginPath();ctx.ellipse(x-9,y-7,11,4+Math.abs(f)*0.4,-0.5,0,6.3);ctx.ellipse(x+9,y-7,11,4+Math.abs(f)*0.4,0.5,0,6.3);ctx.fill();ctx.fillStyle='#0c0807';ctx.beginPath();ctx.ellipse(x,y,9,7,0,0,6.3);ctx.fill();ctx.restore();};
  const tv=(t,a)=>{const n=0.5+0.5*Math.sin(t*23)*Math.sin(t*7.3+1)+0.25*Math.sin(t*41);const hue=['120,170,255','255,150,120','150,230,210'][Math.floor(t*1.7)%3];ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(-80,1250,0,-80,1250,1250);g.addColorStop(0,`rgba(${hue},${a*(0.55+0.45*n)})`);g.addColorStop(1,`rgba(${hue},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.restore();};
  const dust=(t,x0,y0,w,h)=>{ctx.save();ctx.fillStyle='rgba(255,225,180,.5)';for(let i=0;i<26;i++){const x=x0+((i*197.3+t*(8+i%5*3))%w),y=y0+((i*113.7+Math.sin(t*0.7+i)*30+t*(-6-i%3*4))%h+h)%h;ctx.globalAlpha=0.25+0.25*Math.sin(t*2+i);ctx.beginPath();ctx.arc(x,y,1.6+i%3,0,6.3);ctx.fill();}ctx.restore();};
  const candle=(t,x,y)=>{const f=0.75+0.25*Math.sin(t*17)*Math.sin(t*5.3+2);ctx.save();ctx.globalCompositeOperation='screen';const g2=ctx.createRadialGradient(x,y,0,x,y,260*f);g2.addColorStop(0,`rgba(255,190,110,${0.5*f})`);g2.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=g2;ctx.fillRect(x-300,y-300,600,600);ctx.fillStyle='#ffe2a8';ctx.beginPath();ctx.ellipse(x+3*Math.sin(t*9),y-14,7,16*f,0,0,6.3);ctx.fill();ctx.restore();};
  const blink=(t,x0,y0,w,h)=>{ctx.save();for(let i=0;i<40;i++){const on=Math.sin(t*(0.7+i%7*0.31)+i*2.1)>0.55;if(!on)continue;ctx.fillStyle=i%5?'rgba(255,214,140,.85)':'rgba(170,200,255,.85)';ctx.fillRect(x0+(i*173.3)%w,y0+(i*97.7)%h,9,12);}ctx.restore();};
  const glow=(t,x,y,r,rgb)=>{const f=0.6+0.4*Math.sin(t*3.1);ctx.save();ctx.globalCompositeOperation='screen';const g2=ctx.createRadialGradient(x,y,0,x,y,r);g2.addColorStop(0,`rgba(${rgb},${0.28*f})`);g2.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=g2;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();};
  const steam=(t,x,y)=>{ctx.save();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=7;ctx.lineCap='round';for(let i=0;i<3;i++){const p=(t*0.5+i/3)%1;ctx.globalAlpha=0.5*(1-p);ctx.beginPath();ctx.moveTo(x+i*26-26,y-p*150);ctx.quadraticCurveTo(x+i*26-26+22*Math.sin(t*2+i),y-p*150-40,x+i*26-26,y-p*150-80);ctx.stroke();}ctx.restore();};
  // amb is a name, or a list of [name, ...numbers]: tv, dust, candle, blink (city windows), glow (a screen's light), steam, fly
  const AMBF={tv:(t,a=0.16)=>tv(t,a),dust:(t,x=620,y=300,w=420,h=900)=>dust(t,x,y,w,h),candle:(t,x,y)=>candle(t,x,y),blink:(t,x,y,w,h)=>blink(t,x,y,w,h),glow:(t,x,y,r=500,rgb='150,190,255')=>glow(t,x,y,r,rgb),steam:(t,x,y)=>steam(t,x,y),fly:(t,x,y,r)=>fly(x,y,r,t)};
  const AMB={tv:(t)=>tv(t,0.16),flat:(t)=>{tv(t,0.2);dust(t,620,300,420,900);fly(520,1440,90,t);},flat2:(t)=>{tv(t,0.2);fly(700,900,140,t);},fly:(t,s)=>fly(s.fly[0],s.fly[1],s.fly[2],t)};
  const runAmb=(s,t)=>{if(Array.isArray(s.amb))s.amb.forEach(([n,...a])=>AMBF[n](t,...a));else AMB[s.amb](t,s);};
  window.frame=(t)=>{
    const S=EP01.shots,st=TM.starts,du=TM.durs;let i=S.length-1;for(let j=0;j<S.length;j++){if(t<st[j]+du[j]){i=j;break;}}
    const k=Math.min(1,Math.max(0,(t-st[i])/du[i])),s=S[i],lt=t-st[i];
    let days=EP01.daysStart,dig=EP01.dignityStart;for(let j=0;j<=i;j++){const on=j<i||k>0.45;if(S[j].days&&on)days=S[j].days;if(S[j].dignity&&on)dig=S[j].dignity;}
    ctx.save();ctx.fillStyle='#120d0a';ctx.fillRect(0,0,1080,1920);
    // every cut lands with a small punch-in, then keeps pushing; the camera is never quite still
    const z=1.035+0.05*k+0.05*Math.exp(-lt*14);ctx.translate(540+5*Math.sin(t*1.3),960+5*Math.sin(t*1.9+1));ctx.scale(z,z);ctx.translate(-540,-960);
    if(s.live)s.draw(ctx,k,t);else{if(!cache[i]){const c=document.createElement('canvas');c.width=1080;c.height=1920;s.draw(c.getContext('2d'),0.6,t);cache[i]=c;}ctx.drawImage(cache[i],0,0);}
    if(s.amb)runAmb(s,t);
    ctx.restore();
    if(s.hud!==false){drawHUD(ctx,days,dig);if(EP01.hudTitle){ctx.save();ctx.font='600 21px Inter';ctx.letterSpacing='3px';const tw=ctx.measureText(EP01.hudTitle).width+36;ctx.fillStyle='#d9b26a';ctx.beginPath();ctx.roundRect(56,188,tw,42,[14,14,0,0]);ctx.fill();ctx.fillStyle='#17120e';ctx.textAlign='left';ctx.fillText(EP01.hudTitle,74,217);ctx.restore();}}
    if(s.tag)label(ctx,s.tag,s.tagX||200,s.tagY||430,{size:34});
    const c=TM.caps.find((c)=>t>=c.t0&&t<c.t1);
    if(c){const a=Math.min(1,(t-c.t0)/0.07),sc=1+0.3*(1-a),y=s.capY||1420;ctx.save();ctx.globalAlpha=0.4+0.6*a;ctx.translate(470,y);ctx.scale(sc,sc);ctx.translate(-470,-y);drawCaption(ctx,c.w.map(([x,h],n)=>[(n?' ':'')+x,h]),y,c.who==='Z'?'#ff9d86':null);ctx.restore();}
    ctx.save();ctx.globalCompositeOperation='soft-light';ctx.drawImage(gr,(Math.floor(t*15)%7)*-3,0);ctx.restore();
    return cv.toDataURL('image/jpeg',0.9);
  };
  document.title='ready';
} else
(async()=>{
  for(const f of ['600 40px Cormorant','italic 600 40px Cormorant','600 20px Inter','500 20px Inter'])await document.fonts.load(f);
  let days=EP01.daysStart,dig=EP01.dignityStart;
  EP01.shots.forEach((s,i)=>{ if(s.days)days=s.days; if(s.dignity)dig=s.dignity;
    if(i<from||i>=from+n)return;
    ctx.save();ctx.translate((i-from)*1080,0);ctx.beginPath();ctx.rect(0,0,1080,1920);ctx.clip();
    s.draw(ctx,0.6,i); if(s.hud!==false)drawHUD(ctx,days,dig); drawCaption(ctx,[[s.say.split(' ').slice(0,2).join(' ').toUpperCase(),false]],s.capY||1420);
    ctx.fillStyle='rgba(246,236,220,.6)';ctx.font='600 30px Inter';ctx.textAlign='right';ctx.fillText('shot '+(i+1),1040,1870);
    ctx.restore(); });
  grain(ctx,cv.width,1920,0.07);document.title='done';
})();
</script>
