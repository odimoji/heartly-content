<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Cormorant;src:url(../video3d/public/fonts/cormorant-600.woff2);font-weight:600}
@font-face{font-family:Cormorant;src:url(../video3d/public/fonts/cormorant-600i.woff2);font-weight:600;font-style:italic}
@font-face{font-family:Inter;src:url(../video3d/public/fonts/inter-600.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(../video3d/public/fonts/inter-500.woff2);font-weight:500}
body{margin:0;background:#120d0a}
</style>
<canvas id="c" width="2400" height="1560"></canvas>
<script src="kit/zara.js"></script>
<script>
const W=2400,H=1560,ctx=document.getElementById('c').getContext('2d');
function grain(ctx,w,h,a=0.05){const n=document.createElement('canvas');n.width=256;n.height=256;const x=n.getContext('2d'),d=x.createImageData(256,256);let s=7;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const v=s%255;d.data[i]=v;d.data[i+1]=v*0.95;d.data[i+2]=v*0.88;d.data[i+3]=255*a;}x.putImageData(d,0,0);ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=ctx.createPattern(n,'repeat');ctx.fillRect(0,0,w,h);ctx.restore();}
function stage(x,y,w,h){const g=ctx.createRadialGradient(x+w*0.42,y+h*0.5,0,x+w*0.42,y+h*0.5,w*0.75);g.addColorStop(0,'#5a3226');g.addColorStop(0.55,'#2a1712');g.addColorStop(1,'#120d0a');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);}
function floorShadow(x,y,w){ctx.save();ctx.filter='blur(14px)';ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(x,y,w,w*0.16,0,0,6.3);ctx.fill();ctx.restore();}
async function go(){
  await document.fonts.load('600 40px Cormorant');await document.fonts.load('600 20px Inter');await document.fonts.load('italic 600 40px Cormorant');
  ctx.fillStyle='#120d0a';ctx.fillRect(0,0,W,H);
  const names=Object.keys(ZEXPR);
  [['soft','OPTION A','soft and rounded'],['graphic','OPTION B','taller and sharper']].forEach(([style,t1,t2],k)=>{
    const ox=k*1200;
    stage(ox,0,1200,H);
    ctx.textAlign='left';ctx.fillStyle='#d9b26a';ctx.font='600 26px Inter';ctx.letterSpacing='6px';ctx.fillText(t1,ox+70,92);ctx.letterSpacing='0px';
    ctx.fillStyle='#f6ecdc';ctx.font='600 64px Cormorant';ctx.fillText('Zara, '+t2,ox+70,158);
    // full figure
    floorShadow(ox+260,1420,170);
    drawZara(ctx,ox+260,1410,style==='soft'?1000:1130,style,'neutral',{armL:[0.16,0.1],armR:[0.22,-2.35],phone:'R'});
    // expressions
    names.forEach((n,i)=>{
      const cx=ox+560+(i%2)*300+150, cy=250+Math.floor(i/2)*320, bw=280,bh=300;
      ctx.save();ctx.beginPath();ctx.roundRect(cx-bw/2,cy,bw,bh,28);ctx.clip();
      const g=ctx.createRadialGradient(cx-40,cy+110,0,cx,cy+150,260);g.addColorStop(0,'#6b3d2d');g.addColorStop(1,'#24140f');ctx.fillStyle=g;ctx.fillRect(cx-bw/2,cy,bw,bh);
      const HH=style==='soft'?540:760;
      drawZara(ctx,cx,cy+(style==='soft'?560:790),HH,style,n,{glow:n==='raw'||n==='dread'?1:0});
      ctx.restore();
      ctx.fillStyle='rgba(18,13,10,.72)';ctx.beginPath();ctx.roundRect(cx-bw/2,cy+bh-46,bw,46,[0,0,28,28]);ctx.fill();
      ctx.textAlign='center';ctx.fillStyle='#f6ecdc';ctx.font='500 22px Inter';ctx.fillText((i+1)+'  '+ZEXPR[n].name,cx,cy+bh-16);
    });
  });
  ctx.fillStyle='rgba(246,236,220,.25)';ctx.fillRect(1199,60,2,H-120);
  grain(ctx,W,H,0.06);
  document.title='done';
}
go();
</script>
